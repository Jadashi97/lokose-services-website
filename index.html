<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lokose Services Group — SBA 8(a) and HUBZone certified small business providing grounds maintenance, painting, and waste disposal services to federal agencies.">
  <title>Lokose Services Group | Federal Contracting Services</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header / Navigation -->
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="Lokose Services Group home">
        <span class="logo-text">Lokose Services Group</span>
      </a>
      <nav aria-label="Primary navigation">
        <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation menu">
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
          <span class="nav-toggle-bar"></span>
        </button>
        <ul id="primary-nav" class="nav-list">
          <li><a href="#certifications">Certifications</a></li>
          <li><a href="#capabilities">Capabilities</a></li>
          <li><a href="#why-us">Why Choose Us</a></li>
          <li><a href="#past-performance">Past Performance</a></li>
          <li><a href="#contact" class="nav-cta">Contact Us</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <!-- Hero Section -->
    <section id="hero" class="hero" aria-labelledby="hero-heading">
      <div class="container">
        <h1 id="hero-heading"><!-- Hero heading --></h1>
        <p class="hero-subtitle"><!-- Hero subtitle --></p>
        <div class="hero-actions">
          <!-- CTA buttons -->
        </div>
      </div>
    </section>

    <!-- Certifications Section -->
    <section id="certifications" class="certifications" aria-labelledby="cert-heading">
      <div class="container">
        <h2 id="cert-heading"><!-- Certifications heading --></h2>
        <div class="cert-grid">
          <!-- Certification badges -->
        </div>
      </div>
    </section>

    <!-- Capabilities Section -->
    <section id="capabilities" class="capabilities" aria-labelledby="cap-heading">
      <div class="container">
        <h2 id="cap-heading"><!-- Capabilities heading --></h2>
        <p class="section-subtitle"><!-- Section subtitle --></p>
        <div class="capabilities-grid">
          <!-- Capability cards -->
        </div>
      </div>
    </section>

    <!-- Why Choose Us Section -->
    <section id="why-us" class="why-us" aria-labelledby="why-heading">
      <div class="container">
        <h2 id="why-heading"><!-- Why Choose Us heading --></h2>
        <div class="why-grid">
          <!-- Value proposition items -->
        </div>
      </div>
    </section>

    <!-- Past Performance Section -->
    <section id="past-performance" class="past-performance" aria-labelledby="perf-heading">
      <div class="container">
        <h2 id="perf-heading"><!-- Past Performance heading --></h2>
        <p class="section-subtitle"><!-- Section subtitle --></p>
        <div class="performance-grid">
          <!-- Past performance cards -->
        </div>
      </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact" aria-labelledby="contact-heading">
      <div class="container">
        <h2 id="contact-heading"><!-- Contact heading --></h2>
        <div class="contact-grid">
          <div class="contact-info">
            <!-- Contact details -->
          </div>
          <form class="contact-form" aria-label="Contact form">
            <!-- Form fields -->
          </form>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p><!-- Footer content --></p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
